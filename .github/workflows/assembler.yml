name: Assembler
on:
  workflow_dispatch:
    inputs:
      run_id: { description: "run id des morceaux p-*", default: "43165451150" }
jobs:
  assembler:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
          pattern: p-*
          path: morceaux
      - run: |
          for d in $(ls morceaux | sort -t- -k2 -n); do echo "file '$PWD/morceaux/$d/p.mp4'" >> liste.txt; done
          cat liste.txt
          ffmpeg -y -f concat -safe 0 -i liste.txt -i audio/son.aac -map 0:v -map 1:a -c:v copy -c:a aac -b:a 256k video.mp4
      - uses: actions/upload-artifact@v4
        with: { name: video, path: video.mp4, retention-days: 7 }
