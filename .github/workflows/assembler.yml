name: Assembler
on:
  workflow_run: { workflows: ["Rendu"], types: [completed] }
  workflow_dispatch:
    inputs:
      audio: { description: "fichier audio", default: "audio/son.aac" }
      run_id: { description: "run id des morceaux p-*", default: "" }
jobs:
  assembler:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          run-id: ${{ inputs.run_id || github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          pattern: p-*
          path: morceaux
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: |
          for d in $(ls morceaux | sort -t- -k2 -n); do echo "file '$PWD/morceaux/$d/p.mp4'" >> liste.txt; done
          cat liste.txt
          ffmpeg -y -f concat -safe 0 -i liste.txt -i ${{ inputs.audio || 'audio/fin.aac' }} -map 0:v -map 1:a -c:v copy -c:a aac -b:a 256k -shortest video.mp4
      - uses: actions/upload-artifact@v4
        with: { name: video, path: video.mp4, retention-days: 7 }
