name: Rendu
on:
  push:
    paths: ["src/fin/**", "audio/fin.aac", ".github/workflows/rendu.yml"]
  workflow_dispatch:
    inputs:
      debut: { description: "première image", default: "0" }
      fin: { description: "dernière image", default: "2123" }
      compo: { description: "composition", default: "Video" }
      pas: { description: "images par morceau", default: "75" }
jobs:
  prep:
    runs-on: ubuntu-latest
    outputs:
      morceaux: ${{ steps.m.outputs.morceaux }}
    steps:
      - id: m
        run: |
          a=${{ inputs.debut || 0 }}; f=${{ inputs.fin || 2639 }}; p=${{ inputs.pas || 75 }}; out="["
          while [ $a -le $f ]; do b=$((a+p-1)); [ $b -gt $f ] && b=$f; out="$out\"$a-$b\","; a=$((b+1)); done
          echo "morceaux=${out%,}]" >> $GITHUB_OUTPUT
  rendre:
    needs: prep
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        morceau: ${{ fromJson(needs.prep.outputs.morceaux) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm }
      - run: npm ci
      - run: npx remotion render src/index.ts ${{ inputs.compo || 'Fin' }} p.mp4 --gl=swangle --codec h264 --crf 18 --muted --concurrency=2 --timeout 600000 --frames=${{ matrix.morceau }}
      - uses: actions/upload-artifact@v4
        with: { name: "p-${{ matrix.morceau }}", path: p.mp4, retention-days: 3 }
