name: Rendu
on:
  workflow_dispatch:
    inputs:
      debut: { description: "première image", default: "0" }
      fin: { description: "dernière image", default: "2123" }
      pas: { description: "images par morceau", default: "75" }
jobs:
  prep:
    runs-on: ubuntu-latest
    outputs:
      morceaux: ${{ steps.m.outputs.morceaux }}
    steps:
      - id: m
        run: |
          a=${{ inputs.debut }}; f=${{ inputs.fin }}; p=${{ inputs.pas }}; out="["
          while [ $a -le $f ]; do b=$((a+p-1)); [ $b -gt $f ] && b=$f; out="$out\"$a-$b\","; a=$((b+1)); done
          echo "morceaux=${out%,}]" >> $GITHUB_OUTPUT
  rendre:
    needs: prep
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        morceau: ${{ fromJson(needs.prep.outputs.morceaux) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm }
      - run: npm ci
      - run: npx remotion render src/index.ts Video p.mp4 --gl=swangle --codec h264 --crf 18 --muted --concurrency=2 --timeout 600000 --frames=${{ matrix.morceau }}
      - uses: actions/upload-artifact@v4
        with: { name: "p-${{ matrix.morceau }}", path: p.mp4, retention-days: 3 }
  assembler:
    needs: rendre
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm }
      - run: npm ci
      - uses: actions/download-artifact@v4
        with: { path: morceaux }
      - run: npx remotion render src/index.ts Video son.aac --codec=aac
      - run: |
          for d in $(ls morceaux | sort -t- -k2 -n); do echo "file '$PWD/morceaux/$d/p.mp4'" >> liste.txt; done
          ffmpeg -y -f concat -safe 0 -i liste.txt -i son.aac -map 0:v -map 1:a -c:v copy -c:a aac -b:a 256k video.mp4
      - uses: actions/upload-artifact@v4
        with: { name: video, path: video.mp4, retention-days: 7 }
